services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: develop
    container_name: book-api
    ports:
      - "8080:8080"
    volumes:
      - ./:/go/src/app
    tty: true
    depends_on:
      db:
        condition: service_healthy
      test_db:
        condition: service_healthy
  db:
    image: postgres:16
    restart: always
    container_name: book-db
    ports:
      - ${DB_PORT}:5432
    environment:
      TZ: Asia/Tokyo
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
  test_db:
    image: postgres:16
    restart: always
    container_name: book-test-db
    ports:
      - ${TEST_DB_PORT}:5432
    environment:
      TZ: Asia/Tokyo
      POSTGRES_USER: ${TEST_DB_USER}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD}
      POSTGRES_DB: ${TEST_DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
